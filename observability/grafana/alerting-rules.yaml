apiVersion: 1

groups:
  - orgId: 1
    name: platform-grafana-alerts
    folder: Platform Observability
    interval: 60s
    rules:
      - uid: platform-scrape-ratio-low
        title: Low Scrape Target Availability Ratio
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: platform:scrape_target:up_ratio
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.9
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
              type: threshold
        for: 5m
        noDataState: NoData
        execErrState: Error
        
