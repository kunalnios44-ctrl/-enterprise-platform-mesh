apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root-and-standard-labels
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must run as non-root."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: check-managed-by-label
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pods must include app.kubernetes.io/managed-by label."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/managed-by: "?*"
              
