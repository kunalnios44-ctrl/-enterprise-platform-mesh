name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Compile eBPF if present
        run: |
          if [ -f "bpf/chaos_tc.c" ]; then
            sudo apt-get update
            sudo apt-get install -y clang llvm libbpf-dev linux-headers-$(uname -r)
            clang -O2 -g -target bpf -I/usr/include/$(uname -m)-linux-gnu -c bpf/chaos_tc.c -o bpf/chaos_tc.o
          else
            echo "No bpf/chaos_tc.c found, skipping eBPF build."
          fi

      - name: Test and build Go if present
        run: |
          if [ -f "go.mod" ]; then
            go mod tidy
            go vet ./...
            go test -race ./...
            if [ -d "cmd/agent" ]; then
              mkdir -p bin
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/chaos-agent ./cmd/agent
            fi
          else
            echo "No go.mod found, skipping Go build."
          fi

      - name: Check Terraform if present
        run: |
          if [ -d "deploy/terraform" ]; then
            terraform -chdir=deploy/terraform fmt -check -recursive
            terraform -chdir=deploy/terraform init -backend=false
            terraform -chdir=deploy/terraform validate
          else
            echo "No deploy/terraform found, skipping Terraform check."
          fi

      - name: Check Kubernetes YAML if present
        run: |
          if [ -f "deploy/k8s-guardrail.yaml" ]; then
            echo "Kubernetes manifest found."
          else
            echo "No deploy/k8s-guardrail.yaml found, skipping K8s check."
          fi
          
