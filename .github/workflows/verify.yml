name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: Install eBPF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-$(uname -r)

      - name: Compile eBPF
        run: |
          mkdir -p bpf
          clang -O2 -g -target bpf -I/usr/include/$(uname -m)-linux-gnu -c bpf/chaos_tc.c -o bpf/chaos_tc.o

      - name: Test and build Go
        run: |
          go mod tidy
          go vet ./...
          go test -race ./...
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/chaos-agent ./cmd/agent

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Check Terraform
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Check Kubernetes YAML
        uses: stefanprodan/kube-tools@v1
        with:
          kubeconform: 0.6.7
          command: kubeconform -strict -ignore-missing-schemas -summary deploy/k8s-guardrail.yaml
          
